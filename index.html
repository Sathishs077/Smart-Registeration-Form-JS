<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Details Task</title>
</head>

<body>

    <style>
        body {
            padding: 10px;
        }

        th {
            border: solid black 1px;
            padding: 5px;
        }

        #studentForm {
            border: solid black 1px;
            width: 300px;
            padding: 10px;
        }

        #btn {
            width: 100px;
            background-color: aqua;
        }

        #studentTable {
            margin-top: 10px;
            border-collapse: collapse;
        }

        #studentTable th,
        #studentTable td {
            border: 1px solid black;
            /* Ella cells-kum black border */
            padding: 8px 12px;
            text-align: center;
        }
    </style>

    <h2>STUDENT DETAILS TASK</h2>

    <!-- Student Form using tr and td -->
    <form id="studentForm">
        <table>
            <thead>
                <tr>
                    <th colspan="2">STUDENT FORM</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><label for="name">Name:</label></td>
                    <td><input type="text" id="name" required></td>
                </tr>
                <tr>
                    <td><label for="age">Age:</label></td>
                    <td><input type="number" id="age" required></td>
                </tr>
                <tr>
                    <td><label>Gender:</label></td>
                    <td>
                        <input type="radio" name="gender" value="Male" required> Male
                        <input type="radio" name="gender" value="Female"> Female
                    </td>
                </tr>
                <tr>
                    <td><label for="course">Course:</label></td>
                    <td>
                        <select id="course" required>
                            <option value="" disabled selected>Select Course</option>
                            <option value="JavaScript">JavaScript</option>
                            <option value="Python">Python</option>
                            <option value="Java">Java</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td><label for="email">E-mail:</label></td>
                    <td><input type="email" id="email" required></td>
                </tr>
                <tr>
                    <td colspan="2">
                        <button type="submit" id="btn">Save:</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </form>

    <!-- Student Details Table -->
    <table id="studentTable">
        <thead>
            <tr>
                <th>NAME</th>
                <th>AGE</th>
                <th>COURSE</th>
                <th>GENDER</th>
                <th>EMAIL</th>
                <th>ACTION</th>
            </tr>
        </thead>
        <tbody>
            <!-- Rows will be added here -->
        </tbody>
    </table>

    <script src="script.js"></script>

</body>

</html>
