<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Registration Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Create your account</h1>
    <p class="subtitle">All fields are required.</p>

    <form id="registrationForm" novalidate>
      <table>

        <!-- Name -->
        <tr>
          <td class="label-cell"><label for="name">Name:</label></td>
          <td>
            <input type="text" id="name" name="name" placeholder="Enter Your Name" autocomplete="name">
            <p class="message error" id="nameError" role="alert"></p>
          </td>
        </tr>

        <!-- Email -->
        <tr>
          <td class="label-cell"><label for="email">Email:</label></td>
          <td>
            <input type="email" id="email" name="email" placeholder="example@gmail.com" autocomplete="email">
            <p class="message error" id="emailError" role="alert"></p>
          </td>
        </tr>

        <!-- Password -->
        <tr>
          <td class="label-cell"><label for="password">Password:</label></td>
          <td>
            <input type="password" id="password" name="password" placeholder="At least 6 characters" autocomplete="new-password">
            <p class="message error" id="passwordError" role="alert"></p>
          </td>
        </tr>

        <!-- Bio -->
        <tr>
          <td class="label-cell"><label for="bio">Bio:</label></td>
          <td>
            <textarea id="bio" name="bio" rows="4" maxlength="200" placeholder="Tell us a little about yourself"></textarea>
            <p class="message error" id="bioError" role="alert"></p>
            <p class="counter" id="bioCounter" aria-live="polite">0 / 200 characters</p>
          </td>
        </tr>

        <!-- Submit button -->
        <tr>
          <td colspan="2">
            <button type="submit" id="submitBtn" disabled>Submit</button>
          </td>
        </tr>

      </table>
    </form>

    <p class="message success" id="successMessage" role="status" hidden></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
